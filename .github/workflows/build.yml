name: Build TikVply Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikvply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TikVply APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TikVply
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate fresh Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --project-name=tikvply \
            --org=com.tikvply \
            --android-language=kotlin \
            .

      - name: Install TikVply dependencies
        run: flutter pub get

      - name: Verify repository assets
        shell: bash
        run: |
          test -d assets/images
          test -d assets/animations

      - name: Build TikVply release APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify APK outputs
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload TikVply Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tikvply-android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
