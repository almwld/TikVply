name: Build TikVply Android

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikvply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TikVply APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout TikVply
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true

      - name: Verify workflow toolchain
        run: |
          set -euo pipefail
          java -version
          python3 --version
          git --version

      - name: Show Flutter version
        run: flutter --version

      - name: Generate fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=tikvply --org=com.tikvply --android-language=kotlin .
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'compileSdk = flutter.compileSdkVersion' in text:
              text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          elif 'compileSdk = 34' in text:
              text = text.replace('compileSdk = 34', 'compileSdk = 36')
          else:
              raise SystemExit('Could not locate compileSdk')
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = '''    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'''
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if marker not in text:
              raise SystemExit('Could not locate Android manifest root')
          text = text.replace(marker, marker + '\n' + permissions, 1)
          text = text.replace('<application', '<application android:hardwareAccelerated="true" android:largeHeap="true"', 1)
          service_block = '''        <service
            android:name=".MediaPlaybackService"
            android:exported="false"
            android:foregroundServiceType="mediaPlayback" />
          '''
          text = text.replace('</application>', service_block + '    </application>', 1)
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/tikvply_launcher"', 1)
          text = text.replace('android:exported="true"', 'android:exported="true"\n            android:launchMode="singleTop"\n            android:supportsPictureInPicture="true"', 1)
          marker = '    </activity>'
          intent_block = '''\n        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <category android:name="android.intent.category.BROWSABLE" />\n            <data android:mimeType="video/*" />\n        </intent-filter>\n        <intent-filter>\n            <action android:name="android.intent.action.SEND" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <data android:mimeType="video/*" />\n        </intent-filter>\n'''
          if marker not in text:
              raise SystemExit('Could not locate MainActivity closing tag')
          text = text.replace(marker, intent_block + marker, 1)
          manifest.write_text(text)
          PY
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/tikvply_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#0A8F83" android:pathData="M112,0 L400,0 Q512,0 512,112 L512,400 Q512,512 400,512 L112,512 Q0,512 0,400 L0,112 Q0,0 112,0 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M150,126 L362,126 Q387,126 387,151 L387,361 Q387,386 362,386 L150,386 Q125,386 125,361 L125,151 Q125,126 150,126 Z"/>
            <path android:fillColor="#0A8F83" android:pathData="M205,190 L307,190 Q330,190 330,213 L330,299 Q330,322 307,322 L205,322 Q182,322 182,299 L182,213 Q182,190 205,190 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M244,211 L299,256 L244,301 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M163,149 L349,149 L349,167 L163,167 Z"/>
            <path android:fillColor="#0A8F83" android:pathData="M155,149 A9,9 0,1 0,173 149 A9,9 0,1 0,155 149"/>
          </vector>
          XML
          cat > android/app/src/main/kotlin/com/tikvply/tikvply/MainActivity.kt <<'KOTLIN'
          package com.tikvply.tikvply

          import android.Manifest
          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.os.Build
          import android.util.Rational
                    import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
            private val playerChannelName = "com.tikvply/player"
            private val mediaChannelName = "com.tikvply/media"
            private var mediaChannel: MethodChannel? = null

            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, playerChannelName).setMethodCallHandler { call, result ->
                when (call.method) {
                  "isPipAvailable" -> result.success(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && packageManager.hasSystemFeature("android.software.picture_in_picture"))
                  "enterPip" -> {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val params = PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                      result.success(enterPictureInPictureMode(params))
                    } else result.success(false)
                  }
                  else -> result.notImplemented()
                }
              }
              mediaChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, mediaChannelName)
              mediaChannel!!.setMethodCallHandler { call, result ->
                when (call.method) {
                  "requestNotificationPermission" -> {
                    if (Build.VERSION.SDK_INT >= 33 &&
                        checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 7001)
                    }
                    result.success(true)
                  }
                  "startMedia" -> {
                    val title = call.argument<String>("title") ?: "TikVply"
                    val playing = call.argument<Boolean>("playing") ?: true
                    val intent = Intent(this, MediaPlaybackService::class.java)
                      .putExtra("title", title)
                      .putExtra("playing", playing)
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                    result.success(true)
                  }
                  "updateMedia" -> {
                    val playing = call.argument<Boolean>("playing") ?: false
                    val intent = Intent(this, MediaPlaybackService::class.java)
                      .putExtra("playing", playing)
                      .putExtra("updateOnly", true)
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent) else startService(intent)
                    result.success(true)
                  }
                  "stopMedia" -> {
                    stopService(Intent(this, MediaPlaybackService::class.java))
                    result.success(true)
                  }
                  "showUnseenVideos" -> {
                    val count = call.argument<Int>("count") ?: 0
                    MediaPlaybackService.showUnseenNotification(this, count)
                    result.success(true)
                  }
                  else -> result.notImplemented()
                }
              }
              handleMediaIntent(intent)
            }

            override fun onNewIntent(intent: Intent) {
              super.onNewIntent(intent)
              setIntent(intent)
              handleMediaIntent(intent)
            }

            private fun handleMediaIntent(intent: Intent?) {
              val action = intent?.getStringExtra("media_action") ?: return
              mediaChannel?.invokeMethod("mediaAction", action)
              intent?.removeExtra("media_action")
            }

            override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
              super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
            }
          }
          KOTLIN

          cat > android/app/src/main/kotlin/com/tikvply/tikvply/MediaPlaybackService.kt <<'KOTLIN'
          package com.tikvply.tikvply

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          import android.media.session.MediaSession

          class MediaPlaybackService : Service() {
            companion object {
              private const val CHANNEL_ID = "tikvply_media_playback"
              private const val MEDIA_NOTIFICATION_ID = 4101
              private const val SMART_NOTIFICATION_ID = 4102

              fun showUnseenNotification(context: android.content.Context, count: Int) {
                if (count <= 0) return
                ensureChannel(context)
                val manager = context.getSystemService(NotificationManager::class.java)
                val openIntent = PendingIntent.getActivity(
                  context, 4102,
                  Intent(context, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                )
                val notification = Notification.Builder(context, CHANNEL_ID)
                  .setSmallIcon(android.R.drawable.ic_media_play)
                  .setContentTitle("فيديوهات لم تشاهدها")
                  .setContentText("لديك $count فيديو جديد لم تشاهده في مكتبة TikVply")
                  .setContentIntent(openIntent)
                  .setAutoCancel(true)
                  .setCategory(Notification.CATEGORY_RECOMMENDATION)
                  .setPriority(Notification.PRIORITY_DEFAULT)
                  .build()
                manager.notify(SMART_NOTIFICATION_ID, notification)
              }

              private fun ensureChannel(context: android.content.Context) {
                if (Build.VERSION.SDK_INT >= 26) {
                  val manager = context.getSystemService(NotificationManager::class.java)
                  manager.createNotificationChannel(
                    NotificationChannel(
                      CHANNEL_ID,
                      "TikVply وتشغيل الوسائط",
                      NotificationManager.IMPORTANCE_LOW
                    )
                  )
                }
              }
            }

            private var mediaSession: MediaSession? = null
            private var title = "TikVply"
            private var playing = true

            override fun onCreate() {
              super.onCreate()
              ensureChannel(this)
              mediaSession = MediaSession(this, "TikVplyMedia").apply { isActive = true }
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
              intent?.getStringExtra("title")?.let { title = it }
              if (intent?.hasExtra("playing") == true) playing = intent.getBooleanExtra("playing", true)
              if (Build.VERSION.SDK_INT >= 29) {
                startForeground(MEDIA_NOTIFICATION_ID, buildNotification(), android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
              } else {
                startForeground(MEDIA_NOTIFICATION_ID, buildNotification())
              }
              return START_STICKY
            }

            private fun actionIntent(action: String): PendingIntent {
              val intent = Intent(this, MainActivity::class.java)
                .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                .putExtra("media_action", action)
              return PendingIntent.getActivity(
                this, action.hashCode(), intent,
                PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )
            }

            private fun buildNotification(): Notification {
              return Notification.Builder(this, CHANNEL_ID)
                .setSmallIcon(if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play)
                .setContentTitle(title)
                .setContentText(if (playing) "يعمل في الخلفية" else "متوقف مؤقتًا")
                .setContentIntent(actionIntent("open"))
                .setOngoing(playing)
                .setCategory(Notification.CATEGORY_TRANSPORT)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setStyle(Notification.MediaStyle().setMediaSession(mediaSession?.sessionToken).setShowActionsInCompactView(0))
                .addAction(Notification.Action.Builder(
                  if (playing) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play,
                  if (playing) "إيقاف مؤقت" else "تشغيل",
                  actionIntent(if (playing) "toggle" else "play")
                ).build())
                .addAction(Notification.Action.Builder(
                  android.R.drawable.ic_media_next,
                  "التالي",
                  actionIntent("next")
                ).build())
                .build()
            }

            override fun onDestroy() {
              mediaSession?.release()
              mediaSession = null
              super.onDestroy()
            }

            override fun onBind(intent: Intent?): IBinder? = null
          }
          KOTLIN
          grep -n 'compileSdk\|android:icon\|hardwareAccelerated\|supportsPictureInPicture\|READ_MEDIA\|READ_EXTERNAL\|FOREGROUND_SERVICE\|mimeType="video' android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml

      - name: Validate generated Android project
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/tikvply/tikvply/MainActivity.kt
          test -f android/app/src/main/kotlin/com/tikvply/tikvply/MediaPlaybackService.kt

      - name: Install TikVply dependencies
        run: flutter pub get

      - name: Patch legacy video_thumbnail Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / '.pub-cache'
          candidates = list(cache.glob('hosted/pub.dev/video_thumbnail-*/android/build.gradle'))
          if not candidates:
              print('video_thumbnail Android build.gradle not found; skipping legacy patch')
          else:
              for gradle in candidates:
                  text = gradle.read_text()
                  text = text.replace('jcenter()', 'mavenCentral()')
                  text = re.sub(r'compileSdkVersion\s+33\b', 'compileSdkVersion 36', text)
                  text = re.sub(r'compileSdk\s*=\s*33\b', 'compileSdk = 36', text)
                  gradle.write_text(text)
                  print(f'Patched legacy Android configuration in {gradle}')
          PY

      - name: Remove generated Flutter smoke test
        run: rm -f test/widget_test.dart

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Verify repository assets
        run: |
          test -d assets/images
          test -d assets/animations
          test -f assets/icons/svg/tikvply_logo.svg

      - name: Build TikVply release APKs
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
