name: Build TikVply Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikvply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TikVply APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TikVply
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Clean and Get Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Verify repository assets
        shell: bash
        run: |
          test -d assets/images
          test -d assets/animations

      - name: Fix Android Gradle
        run: |
          # إنشاء android مجلد إذا لم يكن موجوداً
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=tikvply --org=com.tikvply .
          fi
          
          # تحديث gradle-wrapper.properties
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build TikVply release APKs
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Verify APK outputs
        shell: bash
        run: |
          ls -lh build/app/outputs/flutter-apk/
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            echo "✅ ARM64 APK found"
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            echo "✅ ARMv7 APK found"
          fi
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            echo "✅ x86_64 APK found"
          fi

      - name: Upload TikVply Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tikvply-android-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
