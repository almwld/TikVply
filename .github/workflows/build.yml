name: Build TikVply Android

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikvply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TikVply APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TikVply
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate app icons
        run: |
          echo "🎨 Generating app icons..."
          
          mkdir -p assets/images
          mkdir -p assets/icons
          
          if [ ! -f "assets/images/icon.png" ] && [ ! -f "assets/icons/app_icon.png" ]; then
            echo "⚠️ No icon found, creating a default one..."
            sudo apt-get update
            sudo apt-get install -y imagemagick
            convert -size 512x512 xc:'#1a237e' -gravity center -font Helvetica -pointsize 100 -fill white -annotate 0 "TikVply" assets/images/icon.png
            echo "✅ Default icon created at assets/images/icon.png"
          fi
          
          ICON_PATH="assets/images/icon.png"
          if [ -f "assets/icons/app_icon.png" ]; then
            ICON_PATH="assets/icons/app_icon.png"
          fi
          
          echo "📸 Using icon: $ICON_PATH"
          
          if ! grep -q "flutter_launcher_icons" pubspec.yaml; then
            echo "📦 Adding flutter_launcher_icons..."
            flutter pub add --dev flutter_launcher_icons
            
            echo "" >> pubspec.yaml
            echo "flutter_launcher_icons:" >> pubspec.yaml
            echo "  android: true" >> pubspec.yaml
            echo "  ios: false" >> pubspec.yaml
            echo "  image_path: \"$ICON_PATH\"" >> pubspec.yaml
            echo "  adaptive_icon_background: \"#1a237e\"" >> pubspec.yaml
            echo "  adaptive_icon_foreground: \"$ICON_PATH\"" >> pubspec.yaml
            echo "  min_sdk_android: 21" >> pubspec.yaml
          fi
          
          flutter pub get
          flutter pub run flutter_launcher_icons:main || echo "⚠️ Icon generation had issues but continuing..."
          echo "✅ Icons generated successfully!"

      - name: Fix Android configuration
        run: |
          echo "🔧 Fixing Android configuration..."
          
          if [ ! -d "android" ]; then
            echo "📁 Creating Android project..."
            flutter create --platforms=android --project-name=tikvply --org=com.tikvply .
          fi

          echo "📝 Updating gradle-wrapper.properties to 9.3.1..."
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties

          echo "📝 Updating project build.gradle..."
          echo "buildscript {" > android/build.gradle
          echo "    ext.kotlin_version = '1.9.22'" >> android/build.gradle
          echo "    repositories {" >> android/build.gradle
          echo "        google()" >> android/build.gradle
          echo "        mavenCentral()" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "    dependencies {" >> android/build.gradle
          echo "        classpath 'com.android.tools.build:gradle:8.1.0'" >> android/build.gradle
          echo "        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\"" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    repositories {" >> android/build.gradle
          echo "        google()" >> android/build.gradle
          echo "        mavenCentral()" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "rootProject.buildDir = '../build'" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    project.buildDir = \"\${rootProject.buildDir}/\${project.name}\"" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "subprojects {" >> android/build.gradle
          echo "    project.evaluationDependsOn(':app')" >> android/build.gradle
          echo "}" >> android/build.gradle
          echo "tasks.register('clean', Delete) {" >> android/build.gradle
          echo "    delete rootProject.buildDir" >> android/build.gradle
          echo "}" >> android/build.gradle

          echo "📝 Updating app build.gradle..."
          echo "plugins {" > android/app/build.gradle
          echo "    id \"com.android.application\"" >> android/app/build.gradle
          echo "    id \"kotlin-android\"" >> android/app/build.gradle
          echo "    id \"dev.flutter.flutter-gradle-plugin\"" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "android {" >> android/app/build.gradle
          echo "    compileSdkVersion 36" >> android/app/build.gradle
          echo "    ndkVersion flutter.ndkVersion" >> android/app/build.gradle
          echo "    compileOptions {" >> android/app/build.gradle
          echo "        sourceCompatibility JavaVersion.VERSION_17" >> android/app/build.gradle
          echo "        targetCompatibility JavaVersion.VERSION_17" >> android/app/build.gradle
          echo "        coreLibraryDesugaringEnabled true" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    kotlinOptions {" >> android/app/build.gradle
          echo "        jvmTarget = '17'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    defaultConfig {" >> android/app/build.gradle
          echo "        applicationId \"com.tikvply\"" >> android/app/build.gradle
          echo "        minSdkVersion 21" >> android/app/build.gradle
          echo "        targetSdkVersion 36" >> android/app/build.gradle
          echo "        versionCode 1" >> android/app/build.gradle
          echo "        versionName \"1.0.0\"" >> android/app/build.gradle
          echo "        multiDexEnabled true" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "    buildTypes {" >> android/app/build.gradle
          echo "        release {" >> android/app/build.gradle
          echo "            signingConfig signingConfigs.debug" >> android/app/build.gradle
          echo "            minifyEnabled true" >> android/app/build.gradle
          echo "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'" >> android/app/build.gradle
          echo "        }" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "flutter {" >> android/app/build.gradle
          echo "    source '../..'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'" >> android/app/build.gradle
          echo "    implementation 'androidx.multidex:multidex:2.0.1'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

          echo "📝 Updating AndroidManifest.xml..."
          mkdir -p android/app/src/main
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' > android/app/src/main/AndroidManifest.xml
          echo '    package="com.tikvply">' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.CAMERA"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    <application' >> android/app/src/main/AndroidManifest.xml
          echo '        android:label="TikVply"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:name="${applicationName}"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:roundIcon="@mipmap/ic_launcher_round"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> android/app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/LaunchTheme">' >> android/app/src/main/AndroidManifest.xml
          echo '        <activity' >> android/app/src/main/AndroidManifest.xml
          echo '            android:name=".MainActivity"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:exported="true"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:launchMode="singleTop"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:theme="@style/LaunchTheme"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:hardwareAccelerated="true"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:windowSoftInputMode="adjustResize">' >> android/app/src/main/AndroidManifest.xml
          echo '            <meta-data' >> android/app/src/main/AndroidManifest.xml
          echo '                android:name="io.flutter.embedding.android.NormalTheme"' >> android/app/src/main/AndroidManifest.xml
          echo '                android:resource="@style/NormalTheme"/>' >> android/app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN"/>' >> android/app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> android/app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '        </activity>' >> android/app/src/main/AndroidManifest.xml
          echo '        <meta-data' >> android/app/src/main/AndroidManifest.xml
          echo '            android:name="flutterEmbedding"' >> android/app/src/main/AndroidManifest.xml
          echo '            android:value="2"/>' >> android/app/src/main/AndroidManifest.xml
          echo '    </application>' >> android/app/src/main/AndroidManifest.xml
          echo '</manifest>' >> android/app/src/main/AndroidManifest.xml

          echo "📝 Creating styles.xml..."
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/styles.xml
          echo '<resources>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="android:windowBackground">@drawable/launch_background</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '    <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">' >> android/app/src/main/res/values/styles.xml
          echo '        <item name="android:windowBackground">?android:colorBackground</item>' >> android/app/src/main/res/values/styles.xml
          echo '    </style>' >> android/app/src/main/res/values/styles.xml
          echo '</resources>' >> android/app/src/main/res/values/styles.xml

          echo "📝 Creating launch_background.xml..."
          mkdir -p android/app/src/main/res/drawable
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/drawable/launch_background.xml
          echo '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' >> android/app/src/main/res/drawable/launch_background.xml
          echo '    <item android:drawable="@android:color/white" />' >> android/app/src/main/res/drawable/launch_background.xml
          echo '</layer-list>' >> android/app/src/main/res/drawable/launch_background.xml

          echo "✅ Android configuration fixed successfully!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Flutter
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          flutter clean
          flutter pub get

      - name: Verify Android configuration
        run: |
          echo "✅ Verifying Android configuration..."
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "--- compileSdkVersion ---"
          grep "compileSdkVersion" android/app/build.gradle
          echo "--- targetSdkVersion ---"
          grep "targetSdkVersion" android/app/build.gradle
          echo "✅ Configuration verified successfully!"

      - name: Build APKs
        run: |
          echo "🏗️ Building APKs..."
          flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: List APKs
        run: |
          echo "📦 Generated APKs:"
          ls -lh build/app/outputs/flutter-apk/ || echo "⚠️ No APKs found"

      - name: Verify APKs exist
        run: |
          echo "🔍 Verifying APKs..."
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            echo "✅ ARM64 APK found"
          else
            echo "❌ ARM64 APK missing"
            exit 1
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            echo "✅ ARMv7 APK found"
          else
            echo "❌ ARMv7 APK missing"
            exit 1
          fi
          
          if [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            echo "✅ x86_64 APK found"
          else
            echo "❌ x86_64 APK missing"
            exit 1
          fi
          
          echo "✅ All APKs verified successfully!"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tikvply-android-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30
