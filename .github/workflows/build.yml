name: Build TikVply Android

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikvply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TikVply APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TikVply
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Generate fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name=tikvply --org=com.tikvply --android-language=kotlin .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'compileSdk = flutter.compileSdkVersion' in s: s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          elif 'compileSdk = 34' in s: s = s.replace('compileSdk = 34', 'compileSdk = 36')
          else: raise SystemExit('Could not locate compileSdk')
          p.write_text(s)
          PY
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/tikvply_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#0A8F83" android:pathData="M112,0 L400,0 Q512,0 512,112 L512,400 Q512,512 400,512 L112,512 Q0,512 0,400 L0,112 Q0,0 112,0 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M150,126 L362,126 Q387,126 387,151 L387,361 Q387,386 362,386 L150,386 Q125,386 125,361 L125,151 Q125,126 150,126 Z"/>
            <path android:fillColor="#0A8F83" android:pathData="M205,190 L307,190 Q330,190 330,213 L330,299 Q330,322 307,322 L205,322 Q182,322 182,299 L182,213 Q182,190 205,190 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M244,211 L299,256 L244,301 Z"/>
            <path android:fillColor="#FFFFFFFF" android:pathData="M163,149 L349,149 L349,167 L163,167 Z"/>
            <path android:fillColor="#0A8F83" android:pathData="M155,149 A9,9 0,1 0,173 149 A9,9 0,1 0,155 149"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />''')
          s = s.replace('<application', '<application android:hardwareAccelerated="true" android:largeHeap="true"')
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/tikvply_launcher"')
          marker = '    </activity>'
          intent_block = '''        <intent-filter>
            <action android:name="android.intent.action.VIEW" />
            <category android:name="android.intent.category.DEFAULT" />
            <category android:name="android.intent.category.BROWSABLE" />
            <data android:mimeType="video/*" />
        </intent-filter>
        <intent-filter>
            <action android:name="android.intent.action.SEND" />
            <category android:name="android.intent.category.DEFAULT" />
            <data android:mimeType="video/*" />
        </intent-filter>
'''
          if marker not in s: raise SystemExit('Could not locate MainActivity closing tag')
          s = s.replace(marker, intent_block + marker, 1)
          p.write_text(s)
          PY
          grep -n 'compileSdk\|android:icon\|hardwareAccelerated\|FOREGROUND_SERVICE\|mimeType="video' android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml
      - name: Install TikVply dependencies
        run: flutter pub get
      - name: Verify repository assets
        run: |
          test -d assets/images
          test -d assets/animations
          test -f assets/icons/svg/tikvply_logo.svg
      - name: Build TikVply release APKs
        run: flutter build apk --release --split-per-abi
      - name: Verify APK outputs
        run: |
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          ls -lh build/app/outputs/flutter-apk/
      - name: Upload TikVply Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: tikvply-android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
